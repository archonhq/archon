<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archon — Control Room</title>
<style>
  :root {
    --bg: #0f1526;
    --panel: #1a2238;
    --panel2: #232d4a;
    --edge: #2f3a5c;
    --text: #e6ecf8;
    --muted: #8b98b8;
    --accent: #4fd1c5;
    --ok: #38d996;
    --warn: #f6c453;
    --bad: #f06a6a;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 22px; border-bottom: 1px solid var(--edge);
    background: linear-gradient(180deg, #1a2440 0%, #131a2e 100%);
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  .pills { margin-left: auto; display: flex; gap: 10px; }
  .pill {
    font-family: var(--mono); font-size: 12px; padding: 5px 11px;
    border: 1px solid var(--edge); border-radius: 999px; color: var(--muted);
    background: var(--panel);
  }
  .pill b { color: var(--text); }
  main { padding: 22px; max-width: 1100px; margin: 0 auto; }
  .controls { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 9px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--edge); color: var(--text);
    background: linear-gradient(180deg, var(--panel2) 0%, var(--panel) 100%);
    box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 2px 6px rgba(0,0,0,.3);
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.danger { border-color: #7a3a3a; color: #ffb3b3; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status { font-family: var(--mono); font-size: 13px; margin-bottom: 20px; color: var(--muted); }
  .feed {
    border: 1px solid var(--edge); border-radius: 10px; overflow: hidden;
    background: var(--panel); font-family: var(--mono); font-size: 12.5px;
  }
  .feed-head {
    display: flex; justify-content: space-between; padding: 10px 14px;
    border-bottom: 1px solid var(--edge); background: var(--panel2);
    color: var(--muted); letter-spacing: .4px; text-transform: uppercase; font-size: 11px;
  }
  .feed-row {
    display: grid; grid-template-columns: 92px 150px 1fr; gap: 12px;
    padding: 7px 14px; border-bottom: 1px solid rgba(47,58,92,.5);
    align-items: baseline;
  }
  .feed-row:last-child { border-bottom: none; }
  .t { color: var(--muted); }
  .type { color: var(--accent); }
  .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.up { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.down { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Archon <span>·</span> Control Room</h1>
  <div class="pills">
    <span class="pill">adapters <b id="adapters">–</b></span>
    <span class="pill">events <b id="count">–</b></span>
    <span class="pill"><span class="dot up"></span><b id="conn">connecting</b></span>
  </div>
</header>
<main>
  <div class="controls">
    <button data-action="killswitch" data-target="openclaw:main" class="danger">⚡ Kill switch</button>
    <button data-action="start" data-target="openclaw:main">▶ Start</button>
    <button data-action="stop" data-target="openclaw:main">■ Stop</button>
    <button data-action="restart" data-target="openclaw:main">↻ Restart</button>
  </div>
  <div class="status" id="status">—</div>
  <div class="feed">
    <div class="feed-head"><span>Time</span><span>Type</span><span>Detail</span></div>
    <div id="feed"><div class="empty">waiting for events…</div></div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function refresh() {
    try {
      const h = await (await fetch('/api/health')).json();
      $('adapters').textContent = h.adapters.length;
      $('count').textContent = h.events;
      $('conn').textContent = 'live';
      $('conn').parentElement.querySelector('.dot').className = 'dot up';

      const url = '/api/events?limit=60';
      const r = await (await fetch(url)).json();
      render(r.events);
      $('status').textContent = 'last update ' + new Date().toLocaleTimeString();
    } catch (e) {
      $('conn').textContent = 'offline';
      $('conn').parentElement.querySelector('.dot').className = 'dot down';
      $('status').textContent = 'connection lost — retrying';
    }
  }

  function render(events) {
    const feed = $('feed');
    feed.innerHTML = '';
    if (!events.length) {
      feed.innerHTML = '<div class="empty">waiting for events…</div>';
      return;
    }
    for (const e of events.slice().reverse()) {
      const row = document.createElement('div');
      row.className = 'feed-row';
      const t = document.createElement('span'); t.className = 't'; t.textContent = e.ts.slice(11,19);
      const ty = document.createElement('span'); ty.className = 'type'; ty.textContent = e.type;
      const m = document.createElement('span'); m.className = 'msg'; m.textContent = detail(e);
      row.append(t, ty, m);
      feed.appendChild(row);
    }
  }

  function detail(e) {
    if (e.type === 'agent.message') return (e.role || '') + ': ' + (e.text || '');
    if (e.type === 'control.result') return (e.ok ? 'ok' : 'FAIL') + ' — ' + (e.detail || '');
    if (e.state !== undefined) return 'state=' + e.state + (e.detail ? ' · ' + e.detail : '');
    return [e.agent, e.session_id, e.automation, e.service, e.target].filter(Boolean).join(' · ');
  }

  async function control(action, target) {
    $('status').textContent = 'sending ' + action + ' → ' + target + '…';
    try {
      const r = await fetch('/api/control', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action, target, by: 'user'})
      });
      const res = await r.json();
      $('status').textContent = action + ' → ' + target + ': ' + (res.ok ? 'ok' : 'FAIL — ' + (res.detail || ''));
    } catch (e) {
      $('status').textContent = 'control failed to send';
    }
    setTimeout(refresh, 300);
  }

  document.querySelectorAll('button[data-action]').forEach(b =>
    b.addEventListener('click', () => control(b.dataset.action, b.dataset.target)));

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
