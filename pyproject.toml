[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archon"
version = "0.1.0"
description = "The control room for your AI agent fleet — see what your agents are doing, and stop them when they're not."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "archonhq" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
archon = "archon.cli:main"

[tool.setuptools.packages.find]
include = ["archon*"]
